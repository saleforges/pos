global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: merchant
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: iam
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

remote_write:
  - url: http://mimir:9009/api/v1/push
