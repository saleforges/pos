multitenancy_enabled: false

server:
  http_listen_port: 9009

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/blocks
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync

distributor:
  pool:
    health_check_ingesters: true

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1
