services:
  # ========== Metrics ==========
  mimir:
    image: grafana/mimir:latest
    container_name: pos-mimir
    command: -config.file=/etc/mimir/config.yml
    ports:
      - "9009:9009"
    volumes:
      - ./config/mimir:/etc/mimir
      - mimir-data:/tmp/mimir
    networks:
      - pos

  # ========== Traces ==========
  tempo:
    image: grafana/tempo:latest
    container_name: pos-tempo
    command: -config.file=/etc/tempo/config.yml
    user: root
    ports:
      - "3200:3200"    # tempo HTTP
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    volumes:
      - ./config/tempo:/etc/tempo
      - tempo-data:/tmp/tempo
    networks:
      - pos

  # ========== Logs ==========
  loki:
    image: grafana/loki:latest
    container_name: pos-loki
    command: -config.file=/etc/loki/config.yml
    user: root
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki:/etc/loki
      - loki-data:/tmp/loki
    networks:
      - pos

  # ========== Scraper ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: pos-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=otlp-write-receiver
      - --web.enable-remote-write-receiver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - pos

  # ========== Visualization ==========
  grafana:
    image: grafana/grafana:latest
    container_name: pos-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=http://38.225.121.205/grafana/
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    networks:
      - pos
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "PathPrefix(`/grafana`)"
      traefik.http.routers.grafana.entrypoints: "web"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

  # ========== Log Agent ==========
  promtail:
    image: grafana/promtail:latest
    container_name: pos-promtail
    volumes:
      - ./config/promtail:/etc/promtail
      - ./logs:/logs:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - pos

volumes:
  mimir-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  pos:
    name: pos
    external: true
