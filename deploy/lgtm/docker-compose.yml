services:
  # ========== Metrics ==========
  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    restart: unless-stopped
    command: -config.file=/etc/mimir/config.yml
    ports:
      - "9009:9009"
    volumes:
      - ./config/mimir:/etc/mimir
      - mimir-data:/tmp/mimir
    networks:
      - pos

  # ========== Traces ==========
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yml
    user: root
    ports:
      - "3200:3200"    # tempo HTTP
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    volumes:
      - ./config/tempo:/etc/tempo
      - tempo-data:/tmp/tempo
    networks:
      - pos

  # ========== Logs ==========
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    user: root
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki:/etc/loki
      - loki-data:/tmp/loki
    networks:
      - pos

  # ========== Scraper ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=otlp-write-receiver
      - --web.enable-remote-write-receiver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - pos

  # ========== Visualization ==========
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://grafana.saleforges.com/
      - GF_AUTH_LOGIN_MAXIMUM_INACTIVITY_LIFETIME=720h
      - GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DAYS=90
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    networks:
      - pos

  # ========== Log Agent ==========
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail:/etc/promtail
      - ./logs:/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - pos

volumes:
  mimir-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  pos:
    name: pos
    external: true
