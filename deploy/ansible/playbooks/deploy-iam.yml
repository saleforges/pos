- name: Deploy IAM service
  hosts: all
  become: yes
  vars_files:
    - ../vars/vault.yml
  vars:
    ghcr_username: "{{ vault_ghcr_username | default('') }}"
    ghcr_token: "{{ vault_ghcr_token | default('') }}"
    jwt_private_key: "{{ vault_jwt_private_key_pem }}"
    jwt_key_id: "{{ vault_jwt_key_id | default('iam-key-1') }}"
    db_url: "postgres://pos:{{ vault_postgres_password }}@postgres:5432/pos?sslmode=disable"
  tasks:
    - name: Login to GHCR (fresh)
      shell: |
        docker logout ghcr.io 2>/dev/null || true
        echo "{{ ghcr_token }}" | docker login ghcr.io -u "{{ ghcr_username }}" --password-stdin
      when: ghcr_username != '' and ghcr_token != ''
      no_log: true

    - name: Pull IAM image via CLI
      shell: docker pull ghcr.io/saleforges/pos/iam-service:{{ image_tag }}
      when: ghcr_username != '' and ghcr_token != ''
      changed_when: false

    - name: Run IAM container
      community.docker.docker_container:
        name: iam-service
        image: ghcr.io/saleforges/pos/iam-service:{{ image_tag }}
        state: started
        restart_policy: always
        pull: false
        env:
          HTTP_ADDR: ":8080"
          JWT_PRIVATE_KEY_PEM: "{{ jwt_private_key }}"
          JWT_KEY_ID: "{{ jwt_key_id }}"
          DATABASE_URL: "{{ db_url }}"
          OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
        networks:
          - name: pos
