- name: Provision development server
  hosts: all
  become: yes
  vars_files:
    - ../vars/vault.yml
  tasks:
    - name: Install Docker
      ansible.builtin.import_role:
        name: docker

    - name: Run PostgreSQL
      ansible.builtin.import_role:
        name: postgres
      vars:
        postgres_password: "{{ vault_postgres_password }}"

    - name: Run Redis
      ansible.builtin.import_role:
        name: redis

    - name: Run LGTM stack
      ansible.builtin.import_role:
        name: lgtm

    - name: Run MinIO
      ansible.builtin.import_role:
        name: minio
      vars:
        minio_root_password: "{{ vault_minio_password }}"

    - name: Deploy Caddy reverse proxy
      ansible.builtin.import_role:
        name: caddy
      vars:
        caddy_grafana_domain: grafana.saleforges.com
        caddy_api_domain: api-dev.saleforges.com
        caddy_minio_domain: minio.saleforges.com
        caddy_minio_console_domain: minio-console.saleforges.com
        caddy_backoffice_domain: backoffice-dev.saleforges.com
        caddy_pos_domain: pos-dev.saleforges.com
