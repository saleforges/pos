- name: Deploy Order service
  hosts: all
  become: yes
  vars_files:
    - ../vars/vault.yml
  vars:
    ghcr_username: "{{ vault_ghcr_username | default('') }}"
    ghcr_token: "{{ vault_ghcr_token | default('') }}"
    db_url: "postgres://pos:{{ vault_postgres_password }}@postgres:5432/pos?sslmode=disable"
    iam_base_url: "http://iam-service:8080"
    inventory_base_url: "http://inventory-service:8083"
    internal_api_key: "{{ vault_internal_api_key | default('dev-internal-key') }}"
  tasks:
    - name: Login to GHCR (fresh)
      shell: |
        docker logout ghcr.io 2>/dev/null || true
        echo "{{ ghcr_token }}" | docker login ghcr.io -u "{{ ghcr_username }}" --password-stdin
      when: ghcr_username != '' and ghcr_token != ''
      no_log: true

    - name: Pull and run Order container
      community.docker.docker_container:
        name: order-service
        image: ghcr.io/saleforges/pos/order-service:{{ image_tag }}
        state: started
        restart_policy: always
        pull: true
        env:
          ORDER_PORT: ":8084"
          DATABASE_URL: "{{ db_url }}"
          IAM_BASE_URL: "{{ iam_base_url }}"
          INVENTORY_BASE_URL: "{{ inventory_base_url }}"
          INTERNAL_API_KEY: "{{ internal_api_key }}"
          OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
        networks:
          - name: pos
