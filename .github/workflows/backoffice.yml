name: Backoffice CI/CD

on:
  push:
    paths:
      - 'clients/backoffice/**'
      - '.github/workflows/backoffice.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'clients/backoffice/**'
      - '.github/workflows/backoffice.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/backoffice
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

  build-and-push:
    name: Build & Push Docker Image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/backoffice
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: clients/backoffice
          push: true
          tags: |
            ghcr.io/saleforge/pos/backoffice:latest
            ghcr.io/saleforge/pos/backoffice:${{ github.sha }}
