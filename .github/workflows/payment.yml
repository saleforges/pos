name: Payment CI

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: commit SHA)"
        required: false
        type: string
  push:
    paths:
      - 'services/internal/payment/**'
      - 'services/cmd/payment/**'
      - 'services/Dockerfile.payment'
      - 'services/go.mod'
      - 'services/go.sum'
      - 'deploy/ansible/playbooks/deploy-payment.yml'
      - '.github/workflows/payment.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Test payment service
        working-directory: services
        run: |
          go build ./...
          go vet ./internal/payment/...
          go test ./internal/payment/... -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/saleforges/pos/payment-service
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.image_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/Dockerfile.payment
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Create inventory
        run: |
          mkdir -p deploy/ansible/inventory/development
          cat > deploy/ansible/inventory/development/hosts.yml <<EOF
          all:
            hosts:
              dev-server:
                ansible_host: ${{ secrets.DEV_SERVER_IP }}
                ansible_user: ${{ secrets.DEV_SERVER_USER }}
                ansible_become: yes
                ansible_become_password: ${{ secrets.DEV_SUDO_PASSWORD }}
          EOF
      - name: Write vault vars
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/vault-extra.yml << EOV
          vault_postgres_password: "${{ secrets.POSTGRES_PASSWORD }}"
          vault_ghcr_username: "${{ github.actor }}"
          vault_ghcr_token: "$GHCR_TOKEN"
          EOV
      - name: Deploy Payment service
        run: |
          ansible-playbook -i deploy/ansible/inventory/development/hosts.yml \
            deploy/ansible/playbooks/deploy-payment.yml \
            --extra-vars "@/tmp/vault-extra.yml" \
            -e image_tag=${{ inputs.image_tag || github.sha }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_INVENTORY_ENABLED: "yaml"
          ANSIBLE_ROLES_PATH: "deploy/ansible/roles"
