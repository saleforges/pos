name: Payment CI

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: commit SHA)"
        required: false
        type: string
  push:
    paths:
      - 'services/internal/payment/**'
      - 'services/cmd/payment/**'
      - 'services/Dockerfile.payment'
      - 'services/go.mod'
      - 'services/go.sum'
      - 'deploy/ansible/playbooks/deploy-payment.yml'
      - '.github/workflows/payment.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Test payment service
        working-directory: services
        run: |
          go build ./...
          go vet ./internal/payment/...
          go test ./internal/payment/... -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/saleforges/pos/payment-service
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.image_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/Dockerfile.payment
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

      - name: Install Ansible
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install community.docker

      - name: Deploy payment service
        working-directory: deploy/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ansible-playbook -i inventory/development/hosts.yml \
            -e image_tag=$IMAGE_TAG \
            -e ansible_ssh_private_key_file=/dev/null \
            playbooks/deploy-payment.yml
