name: IAM CI

on:
  push:
    paths:
      - "services/iam/**"
      - ".github/workflows/iam.yml"
  pull_request:
    branches:
      - main
      - development
    paths:
      - "services/iam/**"
      - ".github/workflows/iam.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/iam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/iam/go.mod
          cache-dependency-path: services/iam/go.sum
      - name: Test
        run: go test ./... -race -coverprofile=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: iam-coverage
          path: services/iam/coverage.out

  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/iam-service
          docker build -t $IMAGE:${{ github.sha }} -f services/iam/Dockerfile services/iam
          docker push $IMAGE:${{ github.sha }}
